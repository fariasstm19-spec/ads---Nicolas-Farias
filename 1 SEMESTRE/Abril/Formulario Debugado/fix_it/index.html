<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Workshop Dev Web</title>
     <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topo">
    <h1>Workshop Dev Web 2026</h1>
    <p>Explore diferentes áreas da programação e descubra seu caminho na tecnologia.</p>
</header>

<main class="container">

    <section class="card">
        <h2>Inscrição</h2>
        <p>Preencha seus dados para participar do evento.</p>

        <form>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" required>

            <p>Quais áreas da programação você tem interesse?</p>

            <label>
                <input type="checkbox" name="areas" value="web" required>
                Desenvolvimento Web (Front-end/Back-end)
            </label>

            <label>
                <input type="checkbox" name="areas" value="mobile">
                Mobile
            </label>

            <label>
                <input type="checkbox" name="areas" value="ia">
                Inteligência Artificial
            </label>

            <label>
                <input type="checkbox" name="areas" value="dados">
                Ciência de Dados
            </label>

            <label>
                <input type="checkbox" name="areas" value="devops">
                DevOps
            </label>

            <label>
                <input type="checkbox" name="areas" value="seguranca">
                Segurança da Informação
            </label>

            <label>
                <input type="checkbox" name="areas" value="jogos">
                Jogos Digitais
            </label>

            <p>Qual seu nível de experiência em programação?</p>

            <label>
                <input type="radio" name="nivel" value="Iniciante"> 
                Iniciante (0-2 anos)
            </label>

            <label>
                <input type="radio" name="nivel" value="intermediario">
                Intermediário (2-4 anos)
            </label>

            <label>
                <input type="radio" name="nivel" value="avançado">
                Avançado (5 anos +)o
            </label>

            <label for="turno">Melhor turno</label>
            <select id="turno" name="turno">
                <option value="">Selecione</option>
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
            </select>

            <button type="submit">Enviar inscrição</button>

        </form>
    </section>

</main>
</body>



</html>
